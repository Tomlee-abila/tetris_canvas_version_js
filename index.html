<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <div class="score-board">
                <div class="score">Score: <span id="score">0</span></div>
                <div class="timer">Time: <span id="timer">0</span></div>
                <div class="lives">Level: <span id="level">1</span></div>
            </div>
        </div>
        
        <div class="game-area">
            <div id="tetris-board"></div>
            <div class="side-panel">
                <div class="next-piece-container">
                    <h3>Next</h3>
                    <div id="next-piece"></div>
                </div>
                <div class="controls-info">
                    <h3>Controls</h3>
                    <p>← → : Move</p>
                    <p>↑ : Rotate</p>
                    <p>↓ : Soft Drop</p>
                    <p>Space : Hard Drop</p>
                    <p>P : Pause</p>
                </div>
                <div class="debug-controls">
                    <button id="toggle-debug">Toggle Performance Monitor</button>
                    <button id="toggle-frame-limit">Disable 60 FPS Limit</button>
                </div>
            </div>
        </div>
        
        <div id="pause-menu" class="menu hidden">
            <div class="menu-content">
                <h2>Paused</h2>
                <button id="continue-btn">Continue</button>
                <button id="restart-btn">Restart</button>
            </div>
        </div>
        
        <div id="game-over-menu" class="menu hidden">
            <div class="menu-content">
                <h2>Game Over</h2>
                <p>Score: <span id="final-score">0</span></p>
                <button id="restart-game-btn">Play Again</button>
            </div>
        </div>
    </div>

    <script src="tetris.js"></script>
    <script src="debug.js"></script>
    <script src="optimizations.js"></script>
    
    <script>
        // Toggle debug performance monitor
        document.getElementById('toggle-debug').addEventListener('click', function() {
            if (perfMonitor.active) {
                perfMonitor.stopMonitoring();
                document.getElementById('fps-counter').style.display = 'none';
                this.textContent = 'Show Performance Monitor';
            } else {
                perfMonitor.startMonitoring();
                document.getElementById('fps-counter').style.display = 'block';
                this.textContent = 'Hide Performance Monitor';
            }
        });
        
        // Toggle frame limiter
        document.getElementById('toggle-frame-limit').addEventListener('click', function() {
            frameLimiter = !frameLimiter;
            this.textContent = frameLimiter ? 'Disable 60 FPS Limit' : 'Enable 60 FPS Limit';
        });
    </script>
</body>
</html>
