<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game" >
    <h1>Tetris DOM</h1>
    <div id="game-container">
      <canvas id="tetris" width="240" height="400" style="display: none;"></canvas>
      <div id="grid"></div>
      <div id="sidebar">
        <h2>Controls</h2>
        <ul>
          <li>← →: Move</li>
          <li>↓: Drop</li>
          <li>↑: Rotate</li>
          <li>P: Pause</li>
          <li>R: Restart</li>
        </ul>
        <div class="score" style="display: flex; flex-direction: row; gap: 0.5rem;">
          <h2>Score:</h2>
          <h2 style="color: green;">3</h2>
        </div>
        <h2>Next Piece</h2>
        <div id="next">

        </div>
        
        <button id="pauseBtn">Pause</button>
        <button id="resumeBtn">Resume</button>
        <button id="restartBtn">Restart</button>
      </div>
    </div>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
