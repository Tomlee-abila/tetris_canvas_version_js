<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game" >
    <h1>Tetris DOM</h1>
    <div id="game-container">
      
      <div id="sidebar">
        <h2>Controls</h2>
        <ul>
          <li>← →: Move</li>
          <li>↓: Drop</li>
          <li>↑: Rotate</li>
          <li>P: Pause</li>
          <li>R: Restart</li>
        </ul>
      </div>

      <div id="grid"></div>
      <div id="sidebar">        
        <h2>Lives</h2>
        <div  class="lives" style="display: flex; flex-direction: row; gap: 0.5rem;">
          <div class="heart"></div>
          <div class="heart"></div>
          <div class="heart"></div>
        </div>

        <div style="display: flex; flex-direction: row; gap: 0.5rem;">
          <h2>Score:</h2>
          <h2 class="score" style="color: green;">0</h2>
        </div>
        <div style="display: flex; flex-direction: row; gap: 0.2rem;">
          <h2>Time:</h2><h2 class="timer">0</h2><h2>s</h2>
        </div>
        <h2>Next Piece</h2>
        <div id="next">

        </div>
        
        <button id="pauseBtn">Pause</button>
        <button id="restartBtn">Restart</button>
      </div>
    </div>
  </div>
  
  <div id="gameOverPopup" style="display: none;" class="popup">
    <div class="popup-content">
      <h2>Game Over</h2>
      <p>Your Score: <span id="finalScore">0</span></p>
      <button onclick="restart()">Restart</button>
    </div>
  </div>

  <div id="pausePopup" style="display: none;" class="popup">
    <div class="popup-content">
      <h2>Paused</h2>
      <button id="resumeBtn">Resume</button>
    </div>
  </div>
  

  <script src="script.js"></script>
</body>
</html>
